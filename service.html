<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Service — SCALE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter',sans-serif;
      background:#0b0f14;
      color:#fff;
      line-height:1.6;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    .container{
      width:min(1180px,92%);
      margin:auto;
    }

    header{
      position:sticky;
      top:0;
      z-index:999;
      background:rgba(11,15,20,.75);
      backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,255,255,.06);
    }

    .nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:18px 0;
    }

    .logo{
      font-size:1.4rem;
      font-weight:800;
    }

    .hero{
      padding:90px 0;
      display:grid;
      grid-template-columns:1.1fr .9fr;
      gap:50px;
      align-items:start;
    }

    .hero img{
      width:100%;
      border-radius:28px;
      margin-bottom:30px;
      background:#111821;
    }

    .tag{
      display:inline-block;
      background:#13202d;
      color:#7dd3fc;
      padding:8px 14px;
      border-radius:999px;
      font-size:.85rem;
      margin-bottom:24px;
    }

    h1{
      font-size:4rem;
      line-height:1.05;
      margin-bottom:20px;
      letter-spacing:-2px;
    }

    .description{
      color:#b8c5d1;
      font-size:1.05rem;
      margin-bottom:34px;
      white-space:pre-line;
    }

    .card{
      background:#111821;
      border:1px solid rgba(255,255,255,.06);
      border-radius:26px;
      padding:28px;
      margin-bottom:24px;
    }

    .card h3{
      margin-bottom:20px;
      font-size:1.3rem;
    }

    .price{
      font-size:3rem;
      font-weight:800;
      margin-bottom:8px;
    }

    .muted{
      color:#9cb0c3;
    }

    .stat{
      display:flex;
      justify-content:space-between;
      gap:20px;
      padding:16px 0;
      border-bottom:1px solid rgba(255,255,255,.06);
    }

    .stat:last-child{
      border:none;
    }

    .btn{
      width:100%;
      padding:16px;
      border:none;
      border-radius:14px;
      font-weight:700;
      cursor:pointer;
      font-size:1rem;
      margin-top:14px;
    }

    .btn-primary{
      background:#fff;
      color:#000;
    }

    .btn-secondary{
      background:#1a2532;
      color:#fff;
      border:1px solid rgba(255,255,255,.08);
    }

    .payment-box{
      display:none;
      margin-top:24px;
      background:#0e141c;
      border:1px solid rgba(255,255,255,.06);
      border-radius:20px;
      padding:22px;
    }

    .payment-box h4{
      margin-bottom:16px;
    }

    .payment-option{
      background:#141d27;
      border:1px solid rgba(255,255,255,.06);
      padding:18px;
      border-radius:16px;
      margin-bottom:16px;
    }

    input{
      width:100%;
      padding:14px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.08);
      background:#0f1620;
      color:#fff;
      margin-top:12px;
      margin-bottom:12px;
      font-size:1rem;
    }

    .bonus-list,
    .feature-list{
      padding-left:20px;
      color:#d0dae4;
    }

    .bonus-list li,
    .feature-list li{
      margin-bottom:14px;
    }

    .countdown{
      font-size:2.4rem;
      font-weight:800;
      margin-top:12px;
    }

    .reviews{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:24px;
      margin-top:24px;
    }

    .review{
      background:#111821;
      border-radius:22px;
      padding:24px;
      border:1px solid rgba(255,255,255,.06);
    }

    .review p{
      color:#c6d2dd;
      margin-bottom:16px;
    }

    footer{
      padding:40px 0;
      border-top:1px solid rgba(255,255,255,.06);
      color:#93a4b4;
      text-align:center;
      margin-top:80px;
    }

    @media(max-width:900px){

      .hero{
        grid-template-columns:1fr;
      }

      h1{
        font-size:3rem;
      }

    }

  </style>
</head>

<body>

<header>
  <div class="container nav">

    <a href="index.html" class="logo">
      SCALE
    </a>

  </div>
</header>

<section class="container hero">

  <div>

    <img id="serviceImage" src="" alt="Service">

    <div class="tag" id="serviceTag">
      Featured
    </div>

    <h1 id="serviceName">
      Service Name
    </h1>

    <p class="description" id="serviceDescription">
      Loading...
    </p>

    <div class="card">

      <h3>
        Included Bonuses
      </h3>

      <ul class="bonus-list" id="bonusList">
      </ul>

    </div>

    <div class="card">

      <h3>
        Client Reviews
      </h3>

      <div class="reviews" id="reviewsContainer">
      </div>

    </div>

  </div>

  <div>

    <div class="card">

      <div class="price" id="servicePrice">
        $0
      </div>

      <div class="muted" id="paymentText">
        Payment options available
      </div>

      <div class="stat">
        <span>Remaining Spots</span>

        <strong id="remainingSpots">
          --
        </strong>
      </div>

      <div class="stat">
        <span>Next Session</span>

        <strong id="sessionDate">
          --
        </strong>
      </div>

      <div class="stat">
        <span>Enrollment Ends In</span>

        <strong id="countdown">
          --
        </strong>
      </div>

      <button class="btn btn-primary" id="buyBtn">
        Reserve Your Spot
      </button>

      <div class="payment-box" id="paymentBox">

        <h4>
          Choose Payment Option
        </h4>

        <div
          class="payment-option"
          id="fullPaymentOption"
        >

          <strong>
            Full Payment
          </strong>

          <input
            type="email"
            id="fullPaymentEmail"
            placeholder="Your email"
          >

          <button
            class="btn btn-primary"
            id="fullPaymentBtn"
          >
            Request Full Payment
          </button>

        </div>

        <div
          class="payment-option"
          id="installmentOption"
        >

          <strong id="installmentTitle">
            Installments
          </strong>

          <input
            type="email"
            id="installmentEmail"
            placeholder="Your email"
          >

          <button
            class="btn btn-secondary"
            id="installmentBtn"
          >
            Request Installment Plan
          </button>

        </div>

      </div>

    </div>

  </div>

</section>

<footer>

  <div class="container">

    © 2026 SCALE — Premium Growth Systems

  </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://kkrybualwvnderbumjdd.supabase.co";

const SUPABASE_ANON_KEY =
  "YOUR_REAL_ANON_KEY_HERE";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const params =
  new URLSearchParams(window.location.search);

const slug = params.get("slug");

let currentService = null;

async function loadService(){

  const { data, error } = await supabaseClient
    .from("services")
    .select("*")
    .eq("slug", slug)
    .eq("active", true)
    .single();

  if(error || !data){

    console.error(error);

    document.body.innerHTML = `
      <div style="
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:2rem;
      ">
        Service not found
      </div>
    `;

    return;
  }

  currentService = data;

  document.title =
    data.title + " — SCALE";

  document.getElementById("serviceName").innerText =
    data.title || "";

  document.getElementById("serviceDescription").innerText =
    data.full_description || "";

  document.getElementById("servicePrice").innerText =
    "$" + data.price_full;

  document.getElementById("remainingSpots").innerText =
    data.spots_remaining || "Unlimited";

  document.getElementById("sessionDate").innerText =
    data.session_start || "TBA";

  document.getElementById("serviceImage").src =
    data.cover_image || "";

  if(data.installment_enabled){

    document.getElementById("installmentTitle").innerText =
      data.installment_count
        ? data.installment_count + " Installments"
        : "Installments";

  }else{

    document.getElementById("installmentOption")
      .style.display = "none";

  }

  if(
    data.personal_payment_enabled &&
    data.installment_enabled
  ){

    document.getElementById("paymentText").innerText =
      "Full payment and installments available";

  }else if(data.personal_payment_enabled){

    document.getElementById("paymentText").innerText =
      "Full payment available";

  }else if(data.installment_enabled){

    document.getElementById("paymentText").innerText =
      "Installments available";

    document.getElementById("fullPaymentOption")
      .style.display = "none";

  }

  startCountdown(data.countdown_end);

  loadBonuses(data.id);

  loadReviews(data.id);

}

async function loadBonuses(serviceId){

  const { data, error } = await supabaseClient
    .from("bonuses")
    .select("*")
    .eq("service_id", serviceId)
    .order("created_at", {
      ascending:true
    });

  if(error){

    console.error(error);

    return;
  }

  const container =
    document.getElementById("bonusList");

  container.innerHTML = "";

  if(!data.length){

    container.innerHTML = `
      <li>
        No bonuses available.
      </li>
    `;

    return;
  }

  data.forEach(bonus => {

    const li = document.createElement("li");

    li.innerHTML = `
      <strong>${bonus.title}</strong><br>
      ${bonus.description || ""}
    `;

    container.appendChild(li);

  });

}

async function loadReviews(serviceId){

  const { data, error } = await supabaseClient
    .from("reviews")
    .select("*")
    .eq("service_id", serviceId)
    .eq("approved", true)
    .order("created_at", {
      ascending:false
    });

  if(error){

    console.error(error);

    return;
  }

  const container =
    document.getElementById("reviewsContainer");

  container.innerHTML = "";

  if(!data.length){

    container.innerHTML = `
      <div class="review">
        <p>
          No reviews yet.
        </p>
      </div>
    `;

    return;
  }

  data.forEach(review => {

    const div = document.createElement("div");

    div.className = "review";

    div.innerHTML = `

      <p>
        "${review.review_text}"
      </p>

      <strong>
        — ${review.client_name}
      </strong>

    `;

    container.appendChild(div);

  });

}

function startCountdown(deadline){

  if(!deadline){

    document.getElementById("countdown")
      .innerText = "No deadline";

    return;
  }

  const countdown =
    document.getElementById("countdown");

  function update(){

    const now = new Date();

    const target = new Date(deadline);

    const diff = target - now;

    if(diff <= 0){

      countdown.innerText = "Expired";

      return;
    }

    const days =
      Math.floor(diff / 1000 / 60 / 60 / 24);

    const hours =
      Math.floor(diff / 1000 / 60 / 60) % 24;

    const minutes =
      Math.floor(diff / 1000 / 60) % 60;

    const seconds =
      Math.floor(diff / 1000) % 60;

    countdown.innerText =
      days + "d " +
      hours + "h " +
      minutes + "m " +
      seconds + "s";

  }

  update();

  setInterval(update,1000);

}

document.getElementById("buyBtn").onclick = () => {

  const box =
    document.getElementById("paymentBox");

  box.style.display =
    box.style.display === "block"
      ? "none"
      : "block";

};

async function createRequest(type,email){

  if(!email){

    alert("Please enter your email");

    return;
  }

  const { error } = await supabaseClient
    .from("payment_requests")
    .insert([{

      service_id: currentService.id,
      email: email,
      payment_type: type

    }]);

  if(error){

    console.error(error);

    alert("Something went wrong");

    return;
  }

  alert(
    "Your request was received successfully."
  );

}

document.getElementById("fullPaymentBtn").onclick = () => {

  const email =
    document.getElementById(
      "fullPaymentEmail"
    ).value;

  createRequest(
    "full_payment",
    email
  );

};

document.getElementById("installmentBtn").onclick = () => {

  const email =
    document.getElementById(
      "installmentEmail"
    ).value;

  createRequest(
    "installment",
    email
  );

};

loadService();

</script>

</body>
</html>
