<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Scale Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0b0f14;
  color:#fff;
  font-family:'Inter',sans-serif;
  min-height:100vh;
}

.dashboard{
  display:grid;
  grid-template-columns:280px 1fr;
  min-height:100vh;
}

.sidebar{
  background:#111821;
  border-right:1px solid rgba(255,255,255,.06);
  padding:30px;
}

.logo{
  font-size:1.7rem;
  font-weight:800;
  margin-bottom:40px;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.menu button{
  background:#161f2b;
  border:none;
  color:#d4dee8;
  padding:16px;
  border-radius:14px;
  cursor:pointer;
  text-align:left;
  font-size:.95rem;
}

.main{
  padding:40px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:40px;
}

.topbar h1{
  font-size:2.2rem;
}

.logout-btn{
  background:#fff;
  color:#000;
  border:none;
  padding:14px 20px;
  border-radius:14px;
  font-weight:700;
  cursor:pointer;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.card{
  background:#111821;
  border:1px solid rgba(255,255,255,.06);
  border-radius:24px;
  padding:28px;
  margin-bottom:28px;
}

.card h2{
  margin-bottom:24px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

input,
textarea,
select{
  width:100%;
  background:#0f151d;
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  padding:16px;
  color:#fff;
  font-size:1rem;
}

textarea{
  min-height:140px;
  resize:vertical;
}

.full{
  grid-column:1/-1;
}

.save-btn{
  background:#fff;
  color:#000;
  border:none;
  padding:16px 24px;
  border-radius:14px;
  font-weight:700;
  cursor:pointer;
  margin-top:10px;
}

.service-list{
  display:grid;
  gap:18px;
}

.service-item{
  background:#161f2b;
  padding:22px;
  border-radius:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.service-left{
  display:flex;
  gap:18px;
  align-items:flex-start;
}

.service-thumb{
  width:100px;
  height:100px;
  border-radius:16px;
  object-fit:cover;
  background:#0f151d;
}

.service-item h3{
  margin-bottom:6px;
}

.service-item p{
  color:#9fb0c0;
}

.badge{
  display:inline-block;
  padding:6px 12px;
  border-radius:999px;
  background:#1d2b3b;
  color:#7dd3fc;
  font-size:.8rem;
  margin-top:10px;
}

.action-btn{
  border:none;
  background:#fff;
  color:#000;
  padding:12px 18px;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
}

.empty{
  color:#91a2b2;
}

.image-preview{
  width:100%;
  height:240px;
  object-fit:cover;
  border-radius:18px;
  background:#0f151d;
  border:1px solid rgba(255,255,255,.06);
}

 .request-btn{
  border:none;
  padding:12px 18px;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
  font-size:.9rem;
  transition:.2s;
  box-shadow:
    0 4px 12px rgba(0,0,0,.25);
}

.request-btn:hover{

  transform:translateY(-2px);

  filter:brightness(1.08);

}

.contacted-btn{
  background:#2563eb;
  color:white;
}

.paid-btn{
  background:#16a34a;
  color:white;
}

.declined-btn{
  background:#dc2626;
  color:white;
}

.request-actions{

  display:flex;

  gap:10px;

  margin-top:18px;

  flex-wrap:wrap;

}

.status-finished{

  margin-top:18px;

  padding:14px;

  border-radius:14px;

  text-align:center;

  font-weight:700;

  font-size:1rem;

}

.status-paid{

  background:rgba(34,197,94,.12);

  color:#4ade80;

}

.status-declined{

  background:rgba(239,68,68,.12);

  color:#f87171;

} 

 .request-status{

  margin:16px 0;

}

.status-badge{

  display:inline-flex;

  align-items:center;

  gap:8px;

  padding:8px 14px;

  border-radius:999px;

  font-size:.9rem;

  font-weight:700;

}

.status-badge.pending{

  background:rgba(245,158,11,.15);

  color:#fbbf24;

}

.status-badge.contacted{

  background:rgba(59,130,246,.15);

  color:#60a5fa;

}

.status-badge.paid{

  background:rgba(34,197,94,.15);

  color:#4ade80;

}

.status-badge.declined{

  background:rgba(239,68,68,.15);

  color:#f87171;

} 

.payment-tabs{

  display:flex;

  gap:12px;

  margin-bottom:28px;

  flex-wrap:wrap;

}


.payment-tab{

  background:#161f2b;

  border:none;

  color:#cbd5e1;

  padding:12px 18px;

  border-radius:14px;

  cursor:pointer;

  font-weight:700;

  transition:.2s;

}

  
.payment-tab.active{

  background:#2563eb;

  color:white;

}


.payment-content{

  display:none;

}


.payment-content.active{

  display:block;

}  

.review-card{

  background:#0e141c;

  border:1px solid rgba(255,255,255,.06);

  border-radius:16px;

  padding:20px;

  margin-bottom:16px;

}

.review-stars{

  color:#fbbf24;

  font-size:1.1rem;

  margin-bottom:10px;

}

.review-meta{

  color:#91a2b2;

  font-size:.9rem;

  margin-bottom:12px;

}

.review-reply{

  margin-top:14px;

  padding:14px;

  border-radius:12px;

  background:rgba(34,197,94,.08);

  border:1px solid rgba(34,197,94,.15);

}

.reply-btn{

  margin-top:12px;

  background:#2563eb;

  color:white;

  border:none;

  padding:10px 14px;

  border-radius:10px;

  cursor:pointer;

}  

.reply-box{

  margin-top:18px;

  display:flex;

  flex-direction:column;

  gap:12px;

}

.reply-text{

  min-height:110px;

  resize:vertical;

}

.save-reply-btn{

  align-self:flex-end;

  background:#2563eb;

  color:white;

  border:none;

  padding:12px 18px;

  border-radius:12px;

  font-weight:700;

  cursor:pointer;

}

.save-reply-btn:hover{

  opacity:.9;

}  

.review-admin-actions{

margin-top:20px;

display:flex;

gap:12px;

flex-wrap:wrap;

}

.toggle-review-btn{

background:#1d4ed8;

color:white;

border:none;

padding:10px 18px;

border-radius:12px;

cursor:pointer;

font-weight:700;

transition:.2s;

}

.toggle-review-btn:hover{

transform:translateY(-2px);

}
  
@media(max-width:900px){

  .dashboard{
    grid-template-columns:1fr;
  }

  .sidebar{
    border-right:none;
    border-bottom:1px solid rgba(255,255,255,.06);
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .service-item{
    flex-direction:column;
    align-items:flex-start;
  }

}

</style>
</head>

<body>

<div class="dashboard">

  <aside class="sidebar">

    <div class="logo">
      SCALE
    </div>

    <div class="menu">

      <button data-section="servicesSection">
        Services
      </button>

      <button data-section="bonusesSection">
        Bonuses
      </button>

      <button data-section="paymentsSection">

        Payment Requests
 
      </button>

      <button data-section="reviewsSection">
        Reviews
      </button>
      
    </div>

  </aside>

  <main class="main">

    <div class="topbar">

      <h1>
        Dashboard
      </h1>

      <button class="logout-btn" id="logoutBtn">
        Logout
      </button>

    </div>

    <section class="section active" id="servicesSection">

      <div class="card">

        <h2>
          Create Service
        </h2>

        <div class="form-grid">

          <input type="text" id="title" placeholder="Service Title">

          <input type="text" id="slug" placeholder="Slug">

      <input
  type="text"
  id="tag"
  placeholder="Featured,Bestseller"
>

<div style="
  color:#8fa3b8;
  font-size:.85rem;
  margin-top:8px;
">

  Separate multiple tags with commas.

  Example:

  Featured,Bestseller

</div>

          <input type="text" id="price" placeholder="Price">

          <input type="number" id="spots" placeholder="Seats Remaining">

          <input type="text" id="session_start" placeholder="Session Start (May 28)">

          <input type="datetime-local" id="countdown">

          <input type="text" id="image" placeholder="Image URL">

          <select id="installments">
            <option value="true">Installments Enabled</option>
            <option value="false">Installments Disabled</option>
          </select>

          <input type="number" id="installment_count" placeholder="Number of Installments">

          <img
            id="imagePreview"
            class="image-preview full"
            src=""
          >

          <textarea
            id="short_description"
            class="full"
            placeholder="Short Description"
          ></textarea>

          <textarea
            id="full_description"
            class="full"
            placeholder="Full Description"
          ></textarea>

        </div>

        <button class="save-btn" id="saveServiceBtn">
          Save Service
        </button>

      </div>

      <div class="card">

        <h2>
          Existing Services
        </h2>

        <div id="servicesList" class="service-list">

          <div class="empty">
            Loading services...
          </div>

        </div>

      </div>

    </section>

    <section class="section" id="bonusesSection">

  <div class="card">

    <h2>
      Create Bonus
    </h2>

    <div class="form-grid">

      <select id="bonus_service" class="full">
        <option value="">
          Select Parent Service
        </option>
      </select>

      <select id="bonus_bonus_service" class="full">
        <option value="">
          Select Bonus Offer
        </option>
      </select>

      <textarea
        id="bonus_description"
        class="full"
        placeholder="Why this bonus is valuable..."
      ></textarea>

    </div>

    <button class="save-btn" id="saveBonusBtn">
      Add Bonus
    </button>

  </div>

  <div class="card">

    <h2>
      Existing Bonuses
    </h2>

    <div id="bonusesList" class="service-list">

      <div class="empty">
        Loading bonuses...
      </div>

    </div>

  </div>

</section>

<section
  class="section"
  id="paymentsSection"
>

  <div class="card">

    <h2>

      Payment Requests

    </h2>

    <div class="payment-tabs">

      <button
        class="payment-tab active"
        data-tab="pending"
      >

        Pending

        <span id="pendingCount">
          (0)
        </span>

      </button>

      <button
        class="payment-tab"
        data-tab="paid"
      >

        Completed

        <span id="paidCount">
          (0)
        </span>

      </button>

      <button
        class="payment-tab"
        data-tab="declined"
      >

        Declined

        <span id="declinedCount">
          (0)
        </span>

      </button>

    </div>

    <div
      id="pendingRequestsContainer"
      class="payment-content active"
    >

      Loading...

    </div>

    <div
      id="paidRequestsContainer"
      class="payment-content"
    >

    </div>

    <div
      id="declinedRequestsContainer"
      class="payment-content"
    >

    </div>

  </div>

</section>

<section
  class="section"
  id="reviewsSection"
>

  <div class="card">

    <h2>
      Reviews
    </h2>

    <div id="reviewsContainer">

      Loading...

    </div>

  </div>

</section>    

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/dashboard.js"></script>

<script src="js/services.js"></script>

<script src="js/bonuses.js"></script>

<script src="js/reviews.js"></script>

<script src="js/payments.js"></script>

<script src="js/init.js"></script>
  
</body>
</html>
