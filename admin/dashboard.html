<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Scale Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0b0f14;
  color:#fff;
  font-family:'Inter',sans-serif;
  min-height:100vh;
}

.dashboard{
  display:grid;
  grid-template-columns:280px 1fr;
  min-height:100vh;
}

.sidebar{
  background:#111821;
  border-right:1px solid rgba(255,255,255,.06);
  padding:30px;
}

.logo{
  font-size:1.7rem;
  font-weight:800;
  margin-bottom:40px;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.menu button{
  background:#161f2b;
  border:none;
  color:#d4dee8;
  padding:16px;
  border-radius:14px;
  cursor:pointer;
  text-align:left;
  font-size:.95rem;
}

.main{
  padding:40px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:40px;
}

.topbar h1{
  font-size:2.2rem;
}

.logout-btn{
  background:#fff;
  color:#000;
  border:none;
  padding:14px 20px;
  border-radius:14px;
  font-weight:700;
  cursor:pointer;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.card{
  background:#111821;
  border:1px solid rgba(255,255,255,.06);
  border-radius:24px;
  padding:28px;
  margin-bottom:28px;
}

.card h2{
  margin-bottom:24px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

input,
textarea,
select{
  width:100%;
  background:#0f151d;
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  padding:16px;
  color:#fff;
  font-size:1rem;
}

textarea{
  min-height:140px;
  resize:vertical;
}

.full{
  grid-column:1/-1;
}

.save-btn{
  background:#fff;
  color:#000;
  border:none;
  padding:16px 24px;
  border-radius:14px;
  font-weight:700;
  cursor:pointer;
  margin-top:10px;
}

.service-list{
  display:grid;
  gap:18px;
}

.service-item{
  background:#161f2b;
  padding:22px;
  border-radius:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.service-left{
  display:flex;
  gap:18px;
  align-items:flex-start;
}

.service-thumb{
  width:100px;
  height:100px;
  border-radius:16px;
  object-fit:cover;
  background:#0f151d;
}

.service-item h3{
  margin-bottom:6px;
}

.service-item p{
  color:#9fb0c0;
}

.badge{
  display:inline-block;
  padding:6px 12px;
  border-radius:999px;
  background:#1d2b3b;
  color:#7dd3fc;
  font-size:.8rem;
  margin-top:10px;
}

.action-btn{
  border:none;
  background:#fff;
  color:#000;
  padding:12px 18px;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
}

.empty{
  color:#91a2b2;
}

.image-preview{
  width:100%;
  height:240px;
  object-fit:cover;
  border-radius:18px;
  background:#0f151d;
  border:1px solid rgba(255,255,255,.06);
}

 .request-btn{
  border:none;
  padding:12px 18px;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
  font-size:.9rem;
  transition:.2s;
  box-shadow:
    0 4px 12px rgba(0,0,0,.25);
}

.request-btn:hover{
  transform:translateY(-2px);
}

.contacted-btn{
  background:#2563eb;
  color:white;
}

.paid-btn{
  background:#16a34a;
  color:white;
}

.declined-btn{
  background:#dc2626;
  color:white;
}
  
@media(max-width:900px){

  .dashboard{
    grid-template-columns:1fr;
  }

  .sidebar{
    border-right:none;
    border-bottom:1px solid rgba(255,255,255,.06);
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .service-item{
    flex-direction:column;
    align-items:flex-start;
  }

}

</style>
</head>

<body>

<div class="dashboard">

  <aside class="sidebar">

    <div class="logo">
      SCALE
    </div>

    <div class="menu">

      <button data-section="servicesSection">
        Services
      </button>

      <button data-section="reviewsSection">
        Reviews
      </button>

      <button data-section="bonusesSection">
        Bonuses
      </button>

      <button data-section="paymentsSection">
        Payment Requests
      </button>

    </div>

  </aside>

  <main class="main">

    <div class="topbar">

      <h1>
        Dashboard
      </h1>

      <button class="logout-btn" id="logoutBtn">
        Logout
      </button>

    </div>

    <section class="section active" id="servicesSection">

      <div class="card">

        <h2>
          Create Service
        </h2>

        <div class="form-grid">

          <input type="text" id="title" placeholder="Service Title">

          <input type="text" id="slug" placeholder="Slug">

          <input type="text" id="tag" placeholder="Tag (Featured, Premium etc.)">

          <input type="text" id="price" placeholder="Price">

          <input type="number" id="spots" placeholder="Seats Remaining">

          <input type="text" id="session_start" placeholder="Session Start (May 28)">

          <input type="datetime-local" id="countdown">

          <input type="text" id="image" placeholder="Image URL">

          <select id="installments">
            <option value="true">Installments Enabled</option>
            <option value="false">Installments Disabled</option>
          </select>

          <input type="number" id="installment_count" placeholder="Number of Installments">

          <img
            id="imagePreview"
            class="image-preview full"
            src=""
          >

          <textarea
            id="short_description"
            class="full"
            placeholder="Short Description"
          ></textarea>

          <textarea
            id="full_description"
            class="full"
            placeholder="Full Description"
          ></textarea>

        </div>

        <button class="save-btn" id="saveServiceBtn">
          Save Service
        </button>

      </div>

      <div class="card">

        <h2>
          Existing Services
        </h2>

        <div id="servicesList" class="service-list">

          <div class="empty">
            Loading services...
          </div>

        </div>

      </div>

    </section>

    <section class="section" id="reviewsSection">

      <div class="card">

        <h2>
          Reviews
        </h2>

        <p class="empty">
          Reviews management coming next.
        </p>

      </div>

    </section>

    <section class="section" id="bonusesSection">

  <div class="card">

    <h2>
      Create Bonus
    </h2>

    <div class="form-grid">

      <select id="bonus_service" class="full">
        <option value="">
          Select Parent Service
        </option>
      </select>

      <select id="bonus_bonus_service" class="full">
        <option value="">
          Select Bonus Offer
        </option>
      </select>

      <textarea
        id="bonus_description"
        class="full"
        placeholder="Why this bonus is valuable..."
      ></textarea>

    </div>

    <button class="save-btn" id="saveBonusBtn">
      Add Bonus
    </button>

  </div>

  <div class="card">

    <h2>
      Existing Bonuses
    </h2>

    <div id="bonusesList" class="service-list">

      <div class="empty">
        Loading bonuses...
      </div>

    </div>

  </div>

</section>

   <section class="section" id="paymentsSection">

  <div class="card">

    <h2>
      Payment Requests
    </h2>

    <div id="paymentRequestsContainer">
      Loading...
    </div>

  </div>

</section>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const admin = localStorage.getItem("scale_admin");

if(!admin){

  window.location.href = "/admin/login.html";

}

const SUPABASE_URL =
  "https://kkrybualwvnderbumjdd.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtrcnlidWFsd3ZuZGVyYnVtamRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNjIxOTQsImV4cCI6MjA5MzgzODE5NH0.N0TBaamkdOg-BAVQ28DbTXhUO2nHTxwnGK8maQS0QQA";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let editingServiceId = null;

document.getElementById("logoutBtn").onclick = () => {

  localStorage.removeItem("scale_admin");

  window.location.href = "/admin/login.html";

};

const menuButtons =
  document.querySelectorAll(".menu button");

const sections =
  document.querySelectorAll(".section");

menuButtons.forEach(button => {

  button.onclick = () => {

    const target = button.dataset.section;

    sections.forEach(section => {
      section.classList.remove("active");
    });

    document
      .getElementById(target)
      .classList.add("active");

  };

});

document.getElementById("title").addEventListener("input", e => {

  if(editingServiceId) return;

  const slug = e.target.value
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");

  document.getElementById("slug").value = slug;

});

document.getElementById("image").addEventListener("input", e => {

  document.getElementById("imagePreview").src =
    e.target.value;

});

async function loadServices(){

  const servicesList =
    document.getElementById("servicesList");

  const { data, error } = await supabaseClient
    .from("services")
    .select("*")
    .order("created_at", {
      ascending:false
    });

  if(error){

    console.error(error);

    servicesList.innerHTML = `
      <div class="empty">
        Failed to load services
      </div>
    `;

    return;

  }

  if(!data.length){

    servicesList.innerHTML = `
      <div class="empty">
        No services yet
      </div>
    `;

    return;

  }

  servicesList.innerHTML = "";

  data.forEach(service => {

    const div = document.createElement("div");

    div.className = "service-item";

    div.innerHTML = `

      <div class="service-left">

        <img
          class="service-thumb"
          src="${service.cover_image || ""}"
        >

        <div>

          <h3>
            ${service.title || ""}
          </h3>

          <p>
            ${service.short_description || ""}
          </p>

          <div class="badge">
            ${service.active ? "Active" : "Inactive"}
          </div>

        </div>

      </div>

      <div style="
        display:flex;
        gap:10px;
        flex-wrap:wrap;
      ">

        <button
          class="action-btn"
          onclick="editService('${service.id}')"
        >
          Edit
        </button>

        <button
          class="action-btn"
          onclick="toggleService('${service.id}', ${service.active})"
        >
          ${service.active ? "Disable" : "Enable"}
        </button>

        <button
          class="action-btn"
          style="
            background:#ff5f5f;
            color:white;
          "
          onclick="deleteService('${service.id}')"
        >
          Delete
        </button>

      </div>

    `;

    servicesList.appendChild(div);

  });

}

document.getElementById("saveServiceBtn").onclick = async () => {

  const installmentEnabled =
    document.getElementById("installments").value === "true";

  const payload = {

    title:
      document.getElementById("title").value,

    slug:
      document.getElementById("slug").value,

    tag:
      document.getElementById("tag").value || "Featured",

    short_description:
      document.getElementById("short_description").value,

    full_description:
      document.getElementById("full_description").value,

    price_full:
      document.getElementById("price").value,

    spots_remaining:
      parseInt(
        document.getElementById("spots").value || 0
      ),

    countdown_end:
      document.getElementById("countdown").value || null,

    cover_image:
      document.getElementById("image").value,

    session_start:
      document.getElementById("session_start").value,

    installment_enabled:
      installmentEnabled,

    installment_count:
      installmentEnabled
        ? parseInt(
            document.getElementById("installment_count").value || 3
          )
        : null,

    personal_payment_enabled:true,

    business_payment_enabled:true,

    active:true

  };

  let response;

  if(editingServiceId){

    response = await supabaseClient
      .from("services")
      .update(payload)
      .eq("id", editingServiceId);

  }else{

    response = await supabaseClient
      .from("services")
      .insert([payload]);

  }

  if(response.error){

    console.error(response.error);

    alert(response.error.message);

    return;

  }

  alert(
    editingServiceId
      ? "Service updated"
      : "Service created"
  );

  resetForm();

  loadServices();

};

async function editService(id){

  const { data, error } = await supabaseClient
    .from("services")
    .select("*")
    .eq("id", id)
    .single();

  if(error){

    console.error(error);

    return;

  }

  editingServiceId = id;

  document.getElementById("title").value =
    data.title || "";

  document.getElementById("slug").value =
    data.slug || "";

  document.getElementById("tag").value =
    data.tag || "";

  document.getElementById("short_description").value =
    data.short_description || "";

  document.getElementById("full_description").value =
    data.full_description || "";

  document.getElementById("price").value =
    data.price_full || "";

  document.getElementById("spots").value =
    data.spots_remaining || "";

  document.getElementById("session_start").value =
    data.session_start || "";

  document.getElementById("countdown").value =
    data.countdown_end
      ? data.countdown_end.slice(0,16)
      : "";

  document.getElementById("image").value =
    data.cover_image || "";

  document.getElementById("imagePreview").src =
    data.cover_image || "";

  document.getElementById("installments").value =
    data.installment_enabled
      ? "true"
      : "false";

  document.getElementById("installment_count").value =
    data.installment_count || "";

  document.getElementById("saveServiceBtn").innerText =
    "Update Service";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

async function deleteService(id){

  const confirmed = confirm(
    "Delete this service?"
  );

  if(!confirmed) return;

  const { error } = await supabaseClient
    .from("services")
    .delete()
    .eq("id", id);

  if(error){

    console.error(error);

    alert(error.message);

    return;

  }

  alert("Service deleted");

  loadServices();

}

async function toggleService(id,currentState){

  const { error } = await supabaseClient
    .from("services")
    .update({
      active: !currentState
    })
    .eq("id", id);

  if(error){

    console.error(error);

    alert(error.message);

    return;

  }

  loadServices();

}

function resetForm(){

  editingServiceId = null;

  document.getElementById("title").value = "";

  document.getElementById("slug").value = "";

  document.getElementById("tag").value = "";

  document.getElementById("short_description").value = "";

  document.getElementById("full_description").value = "";

  document.getElementById("price").value = "";

  document.getElementById("spots").value = "";

  document.getElementById("session_start").value = "";

  document.getElementById("countdown").value = "";

  document.getElementById("image").value = "";

  document.getElementById("imagePreview").src = "";

  document.getElementById("installments").value = "true";

  document.getElementById("installment_count").value = "";

  document.getElementById("saveServiceBtn").innerText =
    "Save Service";

}
  
// LOAD BONUS SELECTS

async function loadBonusServiceOptions(){

  const { data, error } = await supabaseClient
    .from("services")
    .select("*")
    .eq("active", true)
    .order("title");

  if(error){

    console.error(error);
    return;

  }

  const parentSelect =
    document.getElementById("bonus_service");

  const bonusSelect =
    document.getElementById("bonus_bonus_service");

  parentSelect.innerHTML = `
    <option value="">
      Select Parent Service
    </option>
  `;

  bonusSelect.innerHTML = `
    <option value="">
      Select Bonus Offer
    </option>
  `;

  data.forEach(service => {

    parentSelect.innerHTML += `
      <option value="${service.id}">
        ${service.title}
      </option>
    `;

    bonusSelect.innerHTML += `
      <option value="${service.id}">
        ${service.title}
      </option>
    `;

  });

}

// SAVE BONUS

document.getElementById("saveBonusBtn").onclick = async () => {

  const serviceId =
    document.getElementById("bonus_service").value;

  const bonusServiceId =
    document.getElementById("bonus_bonus_service").value;

  const description =
    document.getElementById("bonus_description").value;

  if(!serviceId || !bonusServiceId){

    alert("Select both services");
    return;

  }

  const { data: bonusService } = await supabaseClient
    .from("services")
    .select("*")
    .eq("id", bonusServiceId)
    .single();

  const { error } = await supabaseClient
    .from("bonuses")
    .insert([{

      service_id: serviceId,

      title:
        bonusService.title,

      description:
        description,

      bonus_service_id:
        bonusService.id

    }]);

  if(error){

    console.error(error);
    alert(error.message);
    return;

  }

  alert("Bonus added");

  document.getElementById("bonus_description").value = "";

  loadBonuses();

};

// LOAD BONUSES

async function loadBonuses(){

  const bonusesList =
    document.getElementById("bonusesList");

  const { data, error } = await supabaseClient
    .from("bonuses")
    .select(`
      *,
      services!bonuses_service_id_fkey (
        title
      )
    `)
    .order("created_at", {
      ascending:false
    });

  if(error){

    console.error(error);

    bonusesList.innerHTML = `
      <div class="empty">
        Failed to load bonuses
      </div>
    `;

    return;

  }

  if(!data.length){

    bonusesList.innerHTML = `
      <div class="empty">
        No bonuses yet
      </div>
    `;

    return;

  }

  bonusesList.innerHTML = "";

  data.forEach(bonus => {

    const div = document.createElement("div");

    div.className = "service-item";

    div.innerHTML = `

      <div>

        <h3>
          ${bonus.title}
        </h3>

        <p>
          Added to:
          ${bonus.services?.title || "Unknown"}
        </p>

        <div class="badge">
          Bonus Offer
        </div>

      </div>

      <button
        class="action-btn"
        style="
          background:#ff5f5f;
          color:white;
        "
        onclick="deleteBonus('${bonus.id}')"
      >
        Delete
      </button>

    `;

    bonusesList.appendChild(div);

  });

}

// DELETE BONUS

async function deleteBonus(id){

  const confirmed = confirm(
    "Delete this bonus?"
  );

  if(!confirmed) return;

  const { error } = await supabaseClient
    .from("bonuses")
    .delete()
    .eq("id", id);

  if(error){

    console.error(error);
    alert(error.message);
    return;

  }

  alert("Bonus deleted");

  loadBonuses();

}

async function loadPaymentRequests(){

  const { data, error } = await supabaseClient
    .from("payment_requests")
    .select(`
      *,
      services (
        title
      )
    `)
    .order("created_at", {
      ascending:false
    });

  const container =
    document.getElementById(
      "paymentRequestsContainer"
    );

  if(error){

    console.error(error);

    container.innerHTML =
      "Failed to load requests.";

    return;
  }

  if(!data || !data.length){

    container.innerHTML =
      "No payment requests yet.";

    return;
  }

  container.innerHTML = "";

  data.forEach(request => {

    const card =
      document.createElement("div");

    card.style.background =
      "#0e141c";

    card.style.padding =
      "20px";

    card.style.borderRadius =
      "16px";

    card.style.marginBottom =
      "16px";

    card.style.border =
      "1px solid rgba(255,255,255,.06)";

    card.innerHTML = `

      <h3 style="margin-bottom:10px;">
        ${request.full_name || "No Name"}
      </h3>

      <p>
        <strong>Service:</strong>
        ${request.services?.title || "-"}
      </p>

      <p>
        <strong>Email:</strong>
        ${request.customer_email}
      </p>

      <p>
        <strong>Country:</strong>
        ${request.country || "-"}
      </p>

      <p>
        <strong>Payment:</strong>
        ${
          request.payment_type ===
          "full_payment"
            ? "Full Payment"
            : "Installment"
        }
      </p>

      <p>
        <strong>Status:</strong>
        ${request.status}
      </p>

      <p>
        <strong>Requested:</strong>
        ${new Date(
          request.created_at
        ).toLocaleString()}
      </p>

      <div style="
  display:flex;
  gap:10px;
  margin-top:16px;
  flex-wrap:wrap;
">

  <button
    class="request-btn contacted-btn"
    data-id="${request.id}"
  >
    Contacted
  </button>

  <button
    class="request-btn paid-btn"
    data-id="${request.id}"
  >
    Paid
  </button>

  <button
    class="request-btn declined-btn"
    data-id="${request.id}"
  >
    Declined
  </button>

</div>

    `;

    container.appendChild(card);

card
  .querySelector(".contacted-btn")
  .onclick = () =>
    updateRequestStatus(
      request.id,
      "contacted"
    );

card
  .querySelector(".paid-btn")
  .onclick = () =>
    updateRequestStatus(
      request.id,
      "paid"
    );

card
  .querySelector(".declined-btn")
  .onclick = () =>
    updateRequestStatus(
      request.id,
      "declined"
    );
    
  });

}

async function updateRequestStatus(
  requestId,
  status
){

  console.log(
    "BUTTON CLICKED",
    requestId,
    status
  );

  const { data, error } = await supabaseClient
    .from("payment_requests")
    .update({
      status
    })
    .eq("id", requestId)
    .select();

  console.log(
    "updated rows:",
    data
  );

  console.log(
    "error:",
    error
  );

  if(error){

    console.error(
      "UPDATE ERROR:",
      error
    );

    alert(error.message);

    return;
  }

  loadPaymentRequests();

}

loadPaymentRequests();  
  
loadServices();

loadBonusServiceOptions();

loadBonuses();

</script>

</body>
</html>
