<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Scale Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0b0f14;
  color:#fff;
  font-family:'Inter',sans-serif;
  min-height:100vh;
}

.dashboard{
  display:grid;
  grid-template-columns:280px 1fr;
  min-height:100vh;
}

.sidebar{
  background:#111821;
  border-right:1px solid rgba(255,255,255,.06);
  padding:30px;
}

.logo{
  font-size:1.7rem;
  font-weight:800;
  margin-bottom:40px;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.menu button{
  background:#161f2b;
  border:none;
  color:#d4dee8;
  padding:16px;
  border-radius:14px;
  cursor:pointer;
  text-align:left;
  font-size:.95rem;
  transition:.2s;
}

.menu button:hover{
  background:#1c2734;
}

.main{
  padding:40px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:40px;
}

.topbar h1{
  font-size:2.2rem;
}

.logout-btn{
  background:#fff;
  color:#000;
  border:none;
  padding:14px 20px;
  border-radius:14px;
  font-weight:700;
  cursor:pointer;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.card{
  background:#111821;
  border:1px solid rgba(255,255,255,.06);
  border-radius:24px;
  padding:28px;
  margin-bottom:28px;
}

.card h2{
  margin-bottom:24px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

input,
textarea,
select{
  width:100%;
  background:#0f151d;
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  padding:16px;
  color:#fff;
  font-size:1rem;
}

textarea{
  min-height:140px;
  resize:vertical;
}

.full{
  grid-column:1/-1;
}

.save-btn{
  background:#fff;
  color:#000;
  border:none;
  padding:16px 24px;
  border-radius:14px;
  font-weight:700;
  cursor:pointer;
  margin-top:10px;
}

.service-list{
  display:grid;
  gap:18px;
}

.service-item{
  background:#161f2b;
  padding:22px;
  border-radius:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.service-item h3{
  margin-bottom:6px;
}

.service-item p{
  color:#9fb0c0;
}

.badge{
  display:inline-block;
  padding:6px 12px;
  border-radius:999px;
  background:#1d2b3b;
  color:#7dd3fc;
  font-size:.8rem;
  margin-top:10px;
}

.action-btn{
  border:none;
  background:#fff;
  color:#000;
  padding:12px 18px;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
}

.empty{
  color:#91a2b2;
}

@media(max-width:900px){

  .dashboard{
    grid-template-columns:1fr;
  }

  .sidebar{
    border-right:none;
    border-bottom:1px solid rgba(255,255,255,.06);
  }

  .form-grid{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<div class="dashboard">

  <aside class="sidebar">

    <div class="logo">
      SCALE
    </div>

    <div class="menu">

      <button data-section="servicesSection">
        Services
      </button>

      <button data-section="reviewsSection">
        Reviews
      </button>

      <button data-section="bonusesSection">
        Bonuses
      </button>

      <button data-section="paymentsSection">
        Payment Requests
      </button>

    </div>

  </aside>

  <main class="main">

    <div class="topbar">

      <h1>
        Dashboard
      </h1>

      <button class="logout-btn" id="logoutBtn">
        Logout
      </button>

    </div>

    <!-- SERVICES -->

    <section class="section active" id="servicesSection">

      <div class="card">

        <h2>
          Create Service
        </h2>

        <div class="form-grid">

          <input type="text" id="title" placeholder="Service Title">

          <input type="text" id="slug" placeholder="Slug">

          <input type="text" id="price" placeholder="Price">

          <input type="number" id="spots" placeholder="Seats Remaining">

          <input type="datetime-local" id="countdown">

          <input type="text" id="image" placeholder="Image URL">

          <select id="installments">
            <option value="true">Installments Enabled</option>
            <option value="false">Installments Disabled</option>
          </select>

          <select id="bonus_enabled">
            <option value="true">Bonuses Enabled</option>
            <option value="false">Bonuses Disabled</option>
          </select>

          <textarea
            id="short_description"
            class="full"
            placeholder="Short Description"
          ></textarea>

          <textarea
            id="full_description"
            class="full"
            placeholder="Full Description"
          ></textarea>

        </div>

        <button class="save-btn" id="saveServiceBtn">
          Save Service
        </button>

      </div>

      <div class="card">

        <h2>
          Existing Services
        </h2>

        <div id="servicesList" class="service-list">

          <div class="empty">
            Loading services...
          </div>

        </div>

      </div>

    </section>

    <!-- REVIEWS -->

    <section class="section" id="reviewsSection">

      <div class="card">

        <h2>
          Reviews
        </h2>

        <p class="empty">
          Reviews management coming next.
        </p>

      </div>

    </section>

    <!-- BONUSES -->

    <section class="section" id="bonusesSection">

      <div class="card">

        <h2>
          Bonuses
        </h2>

        <p class="empty">
          Bonuses management coming next.
        </p>

      </div>

    </section>

    <!-- PAYMENTS -->

    <section class="section" id="paymentsSection">

      <div class="card">

        <h2>
          Payment Requests
        </h2>

        <p class="empty">
          Customer payment requests will appear here.
        </p>

      </div>

    </section>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const admin = localStorage.getItem("scale_admin");

if(!admin){

  window.location.href = "/admin/login.html";

}

const SUPABASE_URL =
  "https://kkrybualwvnderbumjdd.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtrcnlidWFsd3ZuZGVyYnVtamRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNjIxOTQsImV4cCI6MjA5MzgzODE5NH0.N0TBaamkdOg-BAVQ28DbTXhUO2nHTxwnGK8maQS0QQA";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let editingServiceId = null;

// LOGOUT

document.getElementById("logoutBtn").onclick = () => {

  localStorage.removeItem("scale_admin");

  window.location.href = "/admin/login.html";

};

// SECTION SWITCHING

const menuButtons =
  document.querySelectorAll(".menu button");

const sections =
  document.querySelectorAll(".section");

menuButtons.forEach(button => {

  button.onclick = () => {

    const target = button.dataset.section;

    sections.forEach(section => {

      section.classList.remove("active");

    });

    document
      .getElementById(target)
      .classList.add("active");

  };

});

// LOAD SERVICES

async function loadServices(){

  const servicesList =
    document.getElementById("servicesList");

  const { data, error } = await supabaseClient
    .from("services")
    .select("*")
    .order("created_at", {
      ascending:false
    });

  if(error){

    console.error(error);

    servicesList.innerHTML = `

      <div class="empty">
        Failed to load services
      </div>

    `;

    return;

  }

  if(!data.length){

    servicesList.innerHTML = `

      <div class="empty">
        No services yet
      </div>

    `;

    return;

  }

  servicesList.innerHTML = "";

  data.forEach(service => {

    const div = document.createElement("div");

    div.className = "service-item";

    div.innerHTML = `

      <div>

        <h3>
          ${service.title || ""}
        </h3>

        <p>
          ${service.short_description || ""}
        </p>

        <div class="badge">
          ${service.active ? "Active" : "Inactive"}
        </div>

      </div>

      <div style="
        display:flex;
        gap:10px;
        flex-wrap:wrap;
      ">

        <button
          class="action-btn"
          onclick="editService('${service.id}')"
        >
          Edit
        </button>

        <button
          class="action-btn"
          onclick="toggleService('${service.id}', ${service.active})"
        >
          ${service.active ? "Disable" : "Enable"}
        </button>

        <button
          class="action-btn"
          style="
            background:#ff5f5f;
            color:white;
          "
          onclick="deleteService('${service.id}')"
        >
          Delete
        </button>

      </div>

    `;

    servicesList.appendChild(div);

  });

}

// SAVE / UPDATE SERVICE

document.getElementById("saveServiceBtn").onclick = async () => {

  const payload = {

    title:
      document.getElementById("title").value,

    slug:
      document.getElementById("slug").value,

    short_description:
      document.getElementById("short_description").value,

    full_description:
      document.getElementById("full_description").value,

    price_full:
      document.getElementById("price").value,

    spots_remaining:
      parseInt(
        document.getElementById("spots").value || 0
      ),

    countdown_end:
      document.getElementById("countdown").value || null,

    cover_image:
      document.getElementById("image").value,

    installment_enabled:
      document.getElementById("installments").value === "true",

    installment_count:
      document.getElementById("installments").value === "true"
        ? 3
        : null,

    personal_payment_enabled:true,

    business_payment_enabled:true,

    active:true

  };

  let response;

  if(editingServiceId){

    response = await supabaseClient
      .from("services")
      .update(payload)
      .eq("id", editingServiceId);

  }else{

    response = await supabaseClient
      .from("services")
      .insert([payload]);

  }

  if(response.error){

    console.error(response.error);

    alert(response.error.message);

    return;

  }

  alert(
    editingServiceId
      ? "Service updated"
      : "Service created"
  );

  resetForm();

  loadServices();

};

// EDIT SERVICE

async function editService(id){

  const { data, error } = await supabaseClient
    .from("services")
    .select("*")
    .eq("id", id)
    .single();

  if(error){

    console.error(error);

    return;

  }

  editingServiceId = id;

  document.getElementById("title").value =
    data.title || "";

  document.getElementById("slug").value =
    data.slug || "";

  document.getElementById("short_description").value =
    data.short_description || "";

  document.getElementById("full_description").value =
    data.full_description || "";

  document.getElementById("price").value =
    data.price_full || "";

  document.getElementById("spots").value =
    data.spots_remaining || "";

  document.getElementById("countdown").value =
    data.countdown_end
      ? data.countdown_end.slice(0,16)
      : "";

  document.getElementById("image").value =
    data.cover_image || "";

  document.getElementById("installments").value =
    data.installment_enabled
      ? "true"
      : "false";

  document.getElementById("saveServiceBtn").innerText =
    "Update Service";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

// DELETE SERVICE

async function deleteService(id){

  const confirmed = confirm(
    "Delete this service?"
  );

  if(!confirmed) return;

  const { error } = await supabaseClient
    .from("services")
    .delete()
    .eq("id", id);

  if(error){

    console.error(error);

    alert(error.message);

    return;

  }

  alert("Service deleted");

  loadServices();

}

// TOGGLE ACTIVE

async function toggleService(id,currentState){

  const { error } = await supabaseClient
    .from("services")
    .update({
      active: !currentState
    })
    .eq("id", id);

  if(error){

    console.error(error);

    alert(error.message);

    return;

  }

  loadServices();

}

// RESET FORM

function resetForm(){

  editingServiceId = null;

  document.getElementById("title").value = "";

  document.getElementById("slug").value = "";

  document.getElementById("short_description").value = "";

  document.getElementById("full_description").value = "";

  document.getElementById("price").value = "";

  document.getElementById("spots").value = "";

  document.getElementById("countdown").value = "";

  document.getElementById("image").value = "";

  document.getElementById("installments").value = "true";

  document.getElementById("saveServiceBtn").innerText =
    "Save Service";

}

loadServices();

</script>

</body>
</html>
